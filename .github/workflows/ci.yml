name: ci

# 日常构建/自测：push 与 PR 都跑。
# 与 release.yml 的分工：这里只验「能编译、能过单测、manifest 自洽、六个平台都编得过」，
# 打 tag 时才做产物发布 + 契约符合性验证 + 注册表 PR。
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']       # tag 交给 release.yml，避免同一提交跑两遍
  pull_request:
  workflow_dispatch:

jobs:
  # 单测只需一个平台（纯 Go 无平台分支代码）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        shell: bash
        run: go vet ./...
      - name: go test
        shell: bash
        run: go test ./...

  # 六个发布目标都要编得过：交叉编译暴露的问题（cgo、平台专用符号、文件名大小写）
  # 在本地 Windows 上一次只能发现一个，矩阵里一次全暴露。
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows/amd64
          - windows/arm64
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建（含 manifest 出包）${{ matrix.target }}
        shell: bash
        run: bash build.sh --zip --target "${{ matrix.target }}"

      - name: manifest 自洽检查
        shell: bash
        run: |
          set -euo pipefail
          # manifest 由 build.sh 用本机 helper 吐（交叉编译时目标二进制跑不起来），
          # 这里只断言关键字段齐全、id/version/平台与包名一致。
          man=dist/manifest.json
          [ -f "$man" ] || { echo "缺少 $man"; exit 1; }
          for k in id version kind protocol capabilities; do
            grep -q "\"$k\"" "$man" || { echo "manifest 缺字段: $k"; exit 1; }
          done
          id=$(sed -n 's/.*"id":[[:space:]]*"\([^"]*\)".*/\1/p' "$man" | head -1)
          ver=$(sed -n 's/.*"version":[[:space:]]*"\([^"]*\)".*/\1/p' "$man" | head -1)
          plat="${{ matrix.target }}"
          # 包名必须带平台后缀（W3-55）——同一版本 6 个平台各一个包，同名会互相覆盖
          pkg="dist/$id-$ver-${plat%%/*}-${plat##*/}.zip"
          [ -f "$pkg" ] || { echo "缺插件包 $pkg"; exit 1; }
          echo "manifest ok: id=$id version=$ver platform=$plat pkg=$(basename "$pkg")"

      - name: 产物摘要
        shell: bash
        run: |
          ls -l dist/*.zip dist/*.sha256 2>/dev/null || true
